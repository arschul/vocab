<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocab Hub — Phil Young's English School</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12101c;--surface:#1c1930;--surface-2:#252140;--text:#f4f1ff;--muted:#9a92bd;--border:#312c4f;
    --pink:#ff6bb5;--pink-deep:#3a1229;
    --lime:#a3e635;--lime-deep:#1f2b0c;
    --sky:#38bdf8;--sky-deep:#0b2a3a;
    --tangerine:#fb923c;--tangerine-deep:#3a1f0b;
    --grape:#c084fc;--grape-deep:#2a1440;
    --mint:#2dd4bf;--mint-deep:#0a2b28;
    --good:#4ade80;--bad:#f87171;
    --radius:20px;
  }
  :root[data-theme="light"]{
    --bg:#fdf6ef;--surface:#ffffff;--surface-2:#f6efff;--text:#1f1b2e;--muted:#6b6484;--border:#e7ddf2;
    --pink:#db2777;--pink-deep:#fce7f3;
    --lime:#65a30d;--lime-deep:#f0fbdc;
    --sky:#0284c7;--sky-deep:#e0f2fe;
    --tangerine:#ea580c;--tangerine-deep:#ffedd5;
    --grape:#7c3aed;--grape-deep:#f0e9ff;
    --mint:#0d9488;--mint-deep:#d9faf5;
    --good:#16a34a;--bad:#dc2626;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;transition:background .3s,color .3s;
  }
  h1,h2,h3,.fun{font-family:'Baloo 2',cursive;letter-spacing:-.4px;}

  .topbar{
    position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:.75rem;padding:.85rem 1.25rem;
  }
  .topbar .crumbs{flex:1;display:flex;align-items:center;gap:.5rem;font-size:.9rem;color:var(--muted);flex-wrap:wrap;}
  .topbar .crumbs a{color:var(--muted);text-decoration:none;}
  .topbar .crumbs a:hover{color:var(--text);}
  .topbar .crumbs .sep{opacity:.45;}
  .topbar .crumbs .here{color:var(--text);font-weight:600;}
  .iconbtn{
    width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);
    color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.05rem;
    transition:all .18s;flex-shrink:0;
  }
  .iconbtn:hover{color:var(--text);border-color:var(--text);transform:translateY(-2px);}

  .wrap{max-width:1040px;margin:0 auto;padding:2.5rem 1.25rem 5rem;}

  .hero{text-align:center;margin-bottom:2.5rem;}
  .hero .eyebrow{font-size:.7rem;letter-spacing:4px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:.6rem;}
  .hero h1{font-size:clamp(2.4rem,7vw,4rem);font-weight:800;line-height:1.05;margin-bottom:.6rem;}
  .hero h1 .accent{background:linear-gradient(95deg,var(--pink),var(--tangerine),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero p{color:var(--muted);max-width:460px;margin:0 auto;line-height:1.65;}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.15rem;}

  .tile{
    position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:1.6rem 1.4rem;text-align:left;text-decoration:none;color:inherit;cursor:pointer;
    transition:transform .25s,border-color .25s,box-shadow .25s;display:flex;flex-direction:column;
    font-family:inherit;
  }
  .tile:hover{transform:translateY(-5px) rotate(-.6deg);box-shadow:0 14px 34px rgba(0,0,0,.22);}
  .tile.locked{opacity:.45;pointer-events:none;}
  .tile .big{font-size:2.2rem;line-height:1;margin-bottom:.9rem;}
  .tile h2{font-size:1.35rem;font-weight:700;margin-bottom:.35rem;}
  .tile p{color:var(--muted);font-size:.88rem;line-height:1.55;}
  .tile .pill{
    position:absolute;top:1rem;right:1rem;font-family:'Baloo 2',cursive;font-weight:700;
    font-size:.75rem;padding:.15rem .6rem;border-radius:100px;
  }
  .c-pink{border-color:var(--pink)!important;} .c-pink .pill{background:var(--pink-deep);color:var(--pink);}
  .c-lime{border-color:var(--lime)!important;} .c-lime .pill{background:var(--lime-deep);color:var(--lime);}
  .c-sky{border-color:var(--sky)!important;} .c-sky .pill{background:var(--sky-deep);color:var(--sky);}
  .c-tangerine{border-color:var(--tangerine)!important;} .c-tangerine .pill{background:var(--tangerine-deep);color:var(--tangerine);}
  .c-grape{border-color:var(--grape)!important;} .c-grape .pill{background:var(--grape-deep);color:var(--grape);}
  .c-mint{border-color:var(--mint)!important;} .c-mint .pill{background:var(--mint-deep);color:var(--mint);}

  .badgerow{display:flex;gap:.28rem;margin-top:.9rem;flex-wrap:wrap;}
  .bdot{font-size:.95rem;filter:grayscale(1);opacity:.3;transition:all .2s;}
  .bdot.on{filter:none;opacity:1;transform:scale(1.12);}

  .modegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.9rem;margin-top:1.6rem;}
  .modebtn{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.15rem 1rem;
    cursor:pointer;color:inherit;font-family:'Baloo 2',cursive;font-weight:600;font-size:1rem;
    display:flex;flex-direction:column;align-items:center;gap:.45rem;transition:all .2s;
  }
  .modebtn:hover{transform:translateY(-4px);border-color:var(--pink);}
  .modebtn .ic{font-size:1.6rem;}
  .modebtn small{font-family:'DM Sans',sans-serif;font-weight:400;color:var(--muted);font-size:.72rem;text-align:center;line-height:1.35;}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.6rem;margin-top:1.4rem;}

  .wordrow{
    display:flex;align-items:center;gap:1rem;padding:.85rem .4rem;border-bottom:1px solid var(--border);
  }
  .wordrow:last-child{border-bottom:none;}
  .wordrow .we{font-size:1.7rem;width:2.3rem;text-align:center;flex-shrink:0;}
  .wordrow .wb{flex:1;min-width:0;}
  .wordrow .ww{font-family:'Baloo 2',cursive;font-weight:700;font-size:1.15rem;}
  .wordrow .wp{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-left:.45rem;}
  .wordrow .wd{color:var(--muted);font-size:.88rem;margin-top:.1rem;}
  .wordrow .wx{font-size:.85rem;font-style:italic;opacity:.8;margin-top:.25rem;}
  .spk{background:none;border:1px solid var(--border);border-radius:10px;width:36px;height:36px;cursor:pointer;color:var(--muted);font-size:.95rem;flex-shrink:0;transition:all .18s;}
  .spk:hover{color:var(--sky);border-color:var(--sky);}

  .gamehead{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.2rem;flex-wrap:wrap;}
  .gamehead h2{font-size:1.5rem;font-weight:700;}
  .stat{font-family:'Baloo 2',cursive;font-weight:700;font-size:1.1rem;display:flex;gap:1.1rem;}
  .stat span{color:var(--muted);font-weight:500;font-size:.8rem;font-family:'DM Sans',sans-serif;display:block;}

  .bar{height:8px;border-radius:100px;background:var(--surface-2);overflow:hidden;margin-bottom:1.4rem;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--tangerine));transition:width .35s;}

  .matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
  .mcard{
    background:var(--surface-2);border:2px solid transparent;border-radius:14px;padding:1rem .8rem;
    cursor:pointer;font-family:inherit;color:inherit;font-size:.92rem;line-height:1.4;text-align:center;
    transition:all .18s;min-height:74px;display:flex;align-items:center;justify-content:center;
  }
  .mcard:hover{border-color:var(--muted);}
  .mcard.sel{border-color:var(--sky);background:var(--sky-deep);}
  .mcard.hit{border-color:var(--good);background:var(--lime-deep);opacity:.45;pointer-events:none;}
  .mcard.miss{border-color:var(--bad);animation:shake .35s;}
  .mcard .bigword{font-family:'Baloo 2',cursive;font-weight:700;font-size:1.15rem;}
  .mcard .bigem{font-size:1.9rem;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

  .memgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem;}
  .memcard{
    min-height:108px;border-radius:14px;border:2px solid var(--border);background:var(--surface-2);
    cursor:pointer;font-family:inherit;color:inherit;display:flex;align-items:center;justify-content:center;
    font-size:1.5rem;transition:all .2s;padding:.5rem;text-align:center;line-height:1.35;
  }
  .memcard .def{font-size:.78rem;color:var(--muted);}
  .memcard .face{display:none;}
  .memcard.up .face,.memcard.done .face{display:block;}
  .memcard.up{border-color:var(--sky);background:var(--sky-deep);}
  .memcard.done{border-color:var(--good);background:var(--lime-deep);opacity:.5;pointer-events:none;}
  .memcard .txt{font-family:'Baloo 2',cursive;font-weight:700;font-size:.95rem;}
  .memcard .back{font-size:1.4rem;opacity:.35;}
  .memcard.up .back,.memcard.done .back{display:none;}

  .prompt{text-align:center;padding:2rem 1rem;}
  .prompt .pem{font-size:3.4rem;line-height:1;margin-bottom:.7rem;}
  .prompt .pdef{font-size:1.25rem;font-family:'Baloo 2',cursive;font-weight:600;line-height:1.4;}
  .prompt .pgap{font-size:1.3rem;line-height:1.7;max-width:30ch;margin:0 auto;font-style:italic;word-spacing:.15em;}
  .prompt .ppos{font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem;}
  .prompt .phint{
    margin:1rem auto 0;padding-top:.9rem;border-top:1px dashed var(--border);
    color:var(--muted);font-size:.95rem;line-height:1.5;max-width:32ch;
  }
  .prompt .phint b{display:block;font-family:'Baloo 2',cursive;font-weight:600;
    font-size:.68rem;letter-spacing:2px;text-transform:uppercase;opacity:.75;margin-bottom:.3rem;}
  .prompt .pword{font-size:2.2rem;font-family:'Baloo 2',cursive;font-weight:800;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:1.3rem;}
  .opt{
    background:var(--surface-2);border:2px solid transparent;border-radius:14px;padding:1rem;
    cursor:pointer;font-family:'Baloo 2',cursive;font-weight:700;font-size:1.1rem;color:inherit;transition:all .16s;
  }
  .opt:hover{border-color:var(--muted);}
  .opt.right{border-color:var(--good);background:var(--lime-deep);color:var(--good);}
  .opt.wrong{border-color:var(--bad);background:var(--pink-deep);color:var(--bad);}

  .btn{
    background:var(--pink);color:#fff;border:none;border-radius:100px;padding:.7rem 1.6rem;
    font-family:'Baloo 2',cursive;font-weight:700;font-size:1rem;cursor:pointer;transition:all .2s;
  }
  .btn:hover{transform:translateY(-2px);filter:brightness(1.08);}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
  .btn.ghost:hover{color:var(--text);border-color:var(--text);}
  .btn.mint{background:var(--mint);}
  .btnrow{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;margin-top:1.4rem;}

  .result{text-align:center;padding:2.2rem 1rem;}
  .result .rem{font-size:3.6rem;margin-bottom:.6rem;}
  .result h3{font-size:1.7rem;font-weight:700;margin-bottom:.4rem;}
  .result p{color:var(--muted);}

  .boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem;margin-bottom:1.4rem;}
  .box{background:var(--surface-2);border-radius:12px;padding:.7rem .3rem;text-align:center;border:1px solid var(--border);}
  .box b{display:block;font-family:'Baloo 2',cursive;font-size:1.3rem;}
  .box span{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .box.full{border-color:var(--lime);background:var(--lime-deep);}

  /* board mode */
  body.board .topbar{display:none;}
  .boardwrap{display:none;}
  body.board .boardwrap{display:flex;}
  body.board .wrap{display:none;}
  body.board .boardwrap{padding:1.5rem;min-height:100vh;display:flex;flex-direction:column;}
  .bteams{display:flex;gap:1rem;margin-bottom:1rem;}
  .bteam{flex:1;background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:.8rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem;}
  .bteam.t1{border-color:var(--sky);} .bteam.t2{border-color:var(--tangerine);}
  .bteam .nm{font-family:'Baloo 2',cursive;font-weight:700;font-size:1.2rem;}
  .bteam .sc{font-family:'Baloo 2',cursive;font-weight:800;font-size:2rem;min-width:2.2rem;text-align:center;}
  .bteam button{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);cursor:pointer;font-size:1.1rem;}
  .bstage{
    flex:1;background:var(--surface);border:1px solid var(--border);border-radius:24px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;gap:1rem;
  }
  .bstage .bpos{font-size:.8rem;letter-spacing:4px;text-transform:uppercase;color:var(--muted);}
  .bstage .bdef{font-size:clamp(1.3rem,3.6vw,2.4rem);font-family:'Baloo 2',cursive;font-weight:600;max-width:22ch;line-height:1.3;}
  .bstage .bword{font-size:clamp(2.4rem,8vw,5.5rem);font-family:'Baloo 2',cursive;font-weight:800;color:var(--lime);}
  .bstage .bx{font-size:clamp(1rem,2.4vw,1.6rem);font-style:italic;color:var(--muted);max-width:28ch;}
  .bctrl{display:flex;gap:.7rem;justify-content:center;margin-top:1rem;flex-wrap:wrap;}
  .bctrl .btn{padding:.85rem 2rem;font-size:1.15rem;}

  .voicepanel{
    position:fixed;top:64px;right:1rem;z-index:30;width:min(340px,calc(100vw - 2rem));
    background:var(--surface);border:1px solid var(--border);border-radius:18px;
    box-shadow:0 18px 48px rgba(0,0,0,.35);padding:1.1rem;display:none;
    max-height:70vh;overflow:auto;
  }
  .voicepanel.open{display:block;}
  .voicepanel h3{font-size:1.15rem;margin-bottom:.2rem;}
  .voicepanel .vsub{color:var(--muted);font-size:.8rem;line-height:1.5;margin-bottom:.9rem;}
  .vrow{
    display:flex;align-items:center;gap:.6rem;padding:.55rem .6rem;border-radius:12px;
    border:2px solid transparent;cursor:pointer;transition:all .15s;
  }
  .vrow:hover{background:var(--surface-2);}
  .vrow.on{border-color:var(--mint);background:var(--mint-deep);}
  .vrow .vn{flex:1;min-width:0;}
  .vrow .vn b{font-family:'Baloo 2',cursive;font-weight:600;font-size:.95rem;display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vrow .vn span{color:var(--muted);font-size:.72rem;}
  .vrow .vtest{
    border:1px solid var(--border);background:var(--surface);color:var(--muted);
    border-radius:9px;width:32px;height:32px;cursor:pointer;flex-shrink:0;font-size:.85rem;
  }
  .vrow .vtest:hover{color:var(--sky);border-color:var(--sky);}
  .vempty{color:var(--muted);font-size:.85rem;line-height:1.6;}

  @media print{
    .topbar,.modegrid,.btnrow,.hero p,.spk{display:none!important;}
    body{background:#fff;color:#000;}
    .panel,.tile{border:1px solid #ccc;box-shadow:none;}
    .wordrow{break-inside:avoid;}
  }
  @media(max-width:620px){
    .memgrid{grid-template-columns:repeat(2,1fr);}
    .matchgrid{grid-template-columns:1fr;}
    .opts{grid-template-columns:1fr;}
    .boxes{grid-template-columns:repeat(5,1fr);}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="crumbs" id="crumbs"></div>
  <button class="iconbtn" onclick="toggleVoicePanel()" title="Choose the voice">🗣️</button>
  <button class="iconbtn" id="theme-btn" onclick="toggleTheme()" title="Light / dark">🌙</button>
  <button class="iconbtn" onclick="location.href='https://arschul.github.io/'" title="Classroom Hub">🏠</button>
</div>

<div class="voicepanel" id="voicepanel"></div>

<div class="wrap" id="app"></div>

<div class="boardwrap" id="boardwrap"></div>

<script src="data/manifest.js"></script>
<script>
/* ─────────── state ─────────── */
window.VOCAB_DATA = window.VOCAB_DATA || {};
const M = window.VOCAB_MANIFEST;
const COLORS = ['c-pink','c-lime','c-sky','c-tangerine','c-grape','c-mint'];
const BADGES = [
  {id:'explorer', ic:'📖', name:'Explorer',    how:'See every word in Study'},
  {id:'gapper',   ic:'🧩', name:'Gap Filler',  how:'Finish Sentence Gap'},
  {id:'memory',   ic:'🧠', name:'Memory Champ',how:'Finish Memory Pairs'},
  {id:'picker',   ic:'⚡', name:'Quick Picker',how:'Get 15/15 in Quick Pick'},
  {id:'racer',    ic:'🏁', name:'Racer',       how:'Score 15+ in Word Race'},
  {id:'climber',  ic:'🏔️', name:'Climber',     how:'Get every word to box 5'}
];

function lsGet(k,f){ try{ return JSON.parse(localStorage.getItem(k)) ?? f; }catch(e){ return f; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

function getBadges(){ return lsGet('vocab-badges',{}); }
function hasBadge(key,id){ return !!(getBadges()[key]||{})[id]; }
function award(key,id){
  const b=getBadges(); b[key]=b[key]||{};
  if(b[key][id]) return false;
  b[key][id]=true; lsSet('vocab-badges',b); return true;
}
function getLeitner(key){ return lsGet('vocab-leitner',{})[key]||{}; }
function setLeitner(key,obj){ const a=lsGet('vocab-leitner',{}); a[key]=obj; lsSet('vocab-leitner',a); }

/* ─────────── helpers ─────────── */
function gapSentence(word,sent){
  const re=new RegExp('(^|[^A-Za-z])('+word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![A-Za-z])','i');
  if(!re.test(sent)) return null;
  return sent.replace(re,(m,a)=>a+'_____');
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let voice=null;
function enVoices(){
  if(!('speechSynthesis' in window)) return [];
  return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
}
function savedVoiceId(){ try{ return localStorage.getItem('vocab-voice'); }catch(e){ return null; } }
function pickVoice(){
  const vs=enVoices();
  const saved=savedVoiceId();
  if(saved){
    const hit=vs.find(v=>(v.voiceURI||v.name)===saved);
    if(hit){ voice=hit; return; }
  }
  voice = vs.find(v=>/en[-_]US/i.test(v.lang)&&/female|samantha|zira|google/i.test(v.name))
       || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs[0] || null;
}
function setVoice(id){
  try{ id ? localStorage.setItem('vocab-voice',id) : localStorage.removeItem('vocab-voice'); }catch(e){}
  pickVoice(); renderVoicePanel();
  if(voice) say('This is your new voice.');
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged=()=>{ pickVoice(); if(document.getElementById('voicepanel').classList.contains('open')) renderVoicePanel(); };
}
function say(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=(voice&&voice.lang)||'en-US'; u.rate=.9; if(voice) u.voice=voice;
  speechSynthesis.speak(u);
}
function toggleVoicePanel(){
  const p=document.getElementById('voicepanel');
  p.classList.toggle('open');
  if(p.classList.contains('open')) renderVoicePanel();
}
function renderVoicePanel(){
  const p=document.getElementById('voicepanel');
  const vs=enVoices(), saved=savedVoiceId();
  if(!vs.length){
    p.innerHTML=`<h3>Voice</h3><p class="vempty">No English voices are installed on this device, so listening is turned off. Voices come from the device or browser, not from this page.</p>`;
    return;
  }
  const auto=!saved;
  p.innerHTML=`<h3>Voice</h3>
    <p class="vsub">Used for every word and example in the hub. Voices come from this device, so the list changes from computer to computer.</p>
    <div class="vrow ${auto?'on':''}" data-id="">
      <div class="vn"><b>Automatic</b><span>Best English voice available${auto&&voice?' \u2014 now: '+esc(voice.name):''}</span></div>
    </div>` +
    vs.map(v=>{
      const id=v.voiceURI||v.name;
      return `<div class="vrow ${saved===id?'on':''}" data-id="${esc(id)}">
        <div class="vn"><b>${esc(v.name)}</b><span>${esc(v.lang)}${v.localService?' \u00B7 offline':''}</span></div>
        <button class="vtest" data-test="${esc(id)}" title="Hear this voice">\u25B6</button>
      </div>`;
    }).join('');
  p.querySelectorAll('.vrow').forEach(r=>r.onclick=e=>{
    if(e.target.closest('.vtest')) return;
    setVoice(r.dataset.id||null);
  });
  p.querySelectorAll('.vtest').forEach(b=>b.onclick=()=>{
    const v=enVoices().find(x=>(x.voiceURI||x.name)===b.dataset.test);
    if(!v) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance('The apple is red.');
    u.voice=v; u.lang=v.lang; u.rate=.9;
    speechSynthesis.speak(u);
  });
}
document.addEventListener('click',e=>{
  const p=document.getElementById('voicepanel');
  if(!p.classList.contains('open')) return;
  if(p.contains(e.target)||e.target.closest('.iconbtn')) return;
  p.classList.remove('open');
});

function loadTheme(level,slug){
  const key=level+'/'+slug;
  if(window.VOCAB_DATA[key]) return Promise.resolve(window.VOCAB_DATA[key]);
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='data/'+level+'-'+slug+'.js';
    s.onload=()=>window.VOCAB_DATA[key]?res(window.VOCAB_DATA[key]):rej(new Error('missing'));
    s.onerror=()=>rej(new Error('load failed'));
    document.head.appendChild(s);
  });
}

/* ─────────── router ─────────── */
function parseHash(){
  const h=(location.hash||'#/').replace(/^#\/?/,'');
  return h.split('/').filter(Boolean);
}
function go(path){
  const h='#/'+path;
  if(location.hash===h) route(); else location.hash=h;
}
window.addEventListener('hashchange',route);

function crumbs(parts){
  const c=document.getElementById('crumbs');
  let html='<a href="#/">📚 Vocab Hub</a>';
  parts.forEach((p,i)=>{
    html+='<span class="sep">›</span>';
    html+= i===parts.length-1 ? '<span class="here">'+esc(p.label)+'</span>'
                              : '<a href="#/'+p.to+'">'+esc(p.label)+'</a>';
  });
  c.innerHTML=html;
}

function route(){
  document.body.classList.remove('board');
  document.getElementById('boardwrap').innerHTML='';
  if(window.speechSynthesis) speechSynthesis.cancel();
  const p=parseHash();
  if(p.length===0) return viewLevels();
  const lvl=M.levels.find(l=>l.id===p[0]);
  if(!lvl) return viewLevels();
  if(p.length===1) return viewThemes(lvl);
  const th=lvl.themes.find(t=>t.slug===p[1]);
  if(!th) return viewThemes(lvl);
  const mode=p[2]||'menu';
  loadTheme(lvl.id,th.slug)
    .then(d=>viewTheme(lvl,th,d,mode))
    .catch(()=>{ document.getElementById('app').innerHTML='<div class="panel">Could not load this theme.</div>'; });
}

  crumbs([{label:l.name,to:l.id},{label:t.title}]);

  if(mode==='study')     return renderStudy(app,l,t,d,key);
  if(mode==='gap')       return renderGap(app,l,t,d,key);
  if(mode==='memory')    return renderMemory(app,l,t,d,key);
  if(mode==='quickpick') return renderQuickPick(app,l,t,d,key);

}

/* ── sentence gap ── */
function renderGap(app,l,t,d,key){
  const qs=shuffle(d.words); let i=0, score=0;
  function ask(){
    if(i>=qs.length) return done();
    const w=qs[i];
    const sent=gapSentence(w.w,w.x)||w.x;
    const wrong=shuffle(d.words.filter(x=>x.w!==w.w)).slice(0,3);
    const opts=shuffle([w,...wrong]);
    app.innerHTML=`
      <div class="gamehead"><h2>🧩 Sentence Gap</h2>
        <div class="stat"><div>${i+1}/${qs.length}<span>sentence</span></div><div>${score}<span>correct</span></div></div>
        <button class="btn ghost" onclick="go('${key}')">Quit</button></div>
      <div class="bar"><i style="width:${i/qs.length*100}%"></i></div>
      <div class="panel"><div class="prompt">
        <div class="ppos">Which word fits?</div>
        <div class="pgap">${esc(sent)}</div>
        <div class="phint"><b>It means</b>${esc(w.d)}</div>
      </div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-w="${esc(o.w)}">${esc(o.w)}</button>`).join('')}</div></div>`;
    app.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      app.querySelectorAll('.opt').forEach(x=>{ x.onclick=null;
        if(x.dataset.w===w.w) x.classList.add('right');
        else if(x===el) x.classList.add('wrong');
      });
      if(el.dataset.w===w.w) score++;
      const p=app.querySelector('.pgap');
      if(p) p.innerHTML=esc(w.x);
      say(w.x);
      i++; setTimeout(ask,1400);
    });
  }
  function done(){
    const perfect=score===qs.length;
    const got=perfect?award(key,'gapper'):false;
    app.innerHTML=`<div class="result"><div class="rem">${perfect?'🧩':'👍'}</div>
      <h3>${score} / ${qs.length}</h3>
      <p>${perfect?(got?'Badge unlocked: Gap Filler':'You already had the Gap Filler badge.'):'Get every sentence right to unlock the Gap Filler badge.'}</p>
      <div class="btnrow"><button class="btn" onclick="go('${key}/gap')">Play again</button>
      <button class="btn ghost" onclick="go('${key}')">Back to theme</button></div></div>`;
  }
  ask();
}

/* ── memory pairs: word ↔ meaning ── */
function renderMemory(app,l,t,d,key){
  const pool=shuffle(d.words); let idx=0, roundSize=5, cleared=0;
  function round(){
    const batch=pool.slice(idx,idx+roundSize);
    if(!batch.length) return done();
    let cards=[];
    batch.forEach(w=>{
      cards.push({id:w.w,say:w.w,face:'<span class="txt">'+esc(w.w)+'</span>'});
      cards.push({id:w.w,say:w.d,face:'<span class="def">'+esc(w.d)+'</span>'});
    });
    cards=shuffle(cards);
    let first=null, lock=false, found=0;
    app.innerHTML=`
      <div class="gamehead"><h2>🧠 Memory Pairs</h2>
        <div class="stat"><div>${cleared}<span>pairs found</span></div><div>${d.words.length}<span>total</span></div></div>
        <button class="btn ghost" onclick="go('${key}')">Quit</button></div>
      <div class="bar"><i style="width:${cleared/d.words.length*100}%"></i></div>
      <div class="memgrid">${cards.map((c,i)=>`<button class="memcard" data-i="${i}" data-id="${esc(c.id)}" data-say="${esc(c.say)}"><span class="back">❔</span><span class="face">${c.face}</span></button>`).join('')}</div>`;
    app.querySelectorAll('.memcard').forEach(el=>el.onclick=()=>{
      if(lock||el.classList.contains('up')||el.classList.contains('done')) return;
      el.classList.add('up'); say(el.dataset.say);
      if(!first){ first=el; return; }
      lock=true;
      if(first.dataset.id===el.dataset.id && first!==el){
        setTimeout(()=>{ first.classList.add('done'); el.classList.add('done'); first=null; lock=false;
          found++; cleared++; app.querySelector('.bar i').style.width=(cleared/d.words.length*100)+'%';
          if(found===batch.length){ idx+=roundSize; setTimeout(round,500); }
        },420);
      } else {
        setTimeout(()=>{ first.classList.remove('up'); el.classList.remove('up'); first=null; lock=false; },900);
      }
    });
  }
  function done(){
    const got=award(key,'memory');
    app.innerHTML=`<div class="result"><div class="rem">🧠</div><h3>Every pair found!</h3>
      <p>${got?'Badge unlocked: Memory Champ':'You already had the Memory Champ badge.'}</p>
      <div class="btnrow"><button class="btn" onclick="go('${key}/memory')">Play again</button>
      <button class="btn ghost" onclick="go('${key}')">Back to theme</button></div></div>`;
  }
  round();
}

/* ── word race ── */
function renderRace(app,l,t,d,key){
  let score=0, left=60, timer=null, pool=shuffle(d.words), i=0, over=false, pending=null;
  function ask(){
    if(over) return;
    if(i>=pool.length){ pool=shuffle(d.words); i=0; }
    const w=pool[i++];
    const wrong=shuffle(d.words.filter(x=>x.w!==w.w)).slice(0,3);
    const opts=shuffle([w,...wrong]);
    const useGap=Math.random()<0.5;
    app.innerHTML=`
      <div class="gamehead"><h2>🏁 Word Race</h2>
        <div class="stat"><div id="clk">${left}s<span>left</span></div><div>${score}<span>score</span></div></div>
        <button class="btn ghost" onclick="go('${key}')">Quit</button></div>
      <div class="bar"><i style="width:${left/60*100}%"></i></div>
      <div class="panel"><div class="prompt">
        ${useGap
          ? `<div class="ppos">Which word fits?</div><div class="pgap">${esc(gapSentence(w.w,w.x)||w.x)}</div>
             <div class="phint"><b>It means</b>${esc(w.d)}</div>`
          : `<div class="ppos">${esc(w.pos)}</div><div class="pdef">${esc(w.d)}</div>
             <div class="phint"><b>In a sentence</b>${esc(gapSentence(w.w,w.x)||w.x)}</div>`}
      </div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-w="${esc(o.w)}">${esc(o.w)}</button>`).join('')}</div></div>`;
    app.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      if(over) return;
      if(el.dataset.w===w.w){ score++; el.classList.add('right'); }
      else { el.classList.add('wrong'); }
      pending=setTimeout(ask,190);
    });
  }
  timer=setInterval(()=>{
    left--;
    const c=document.getElementById('clk');
    if(c){ c.childNodes[0].nodeValue=left+'s'; const b=document.querySelector('.bar i'); if(b) b.style.width=(left/60*100)+'%'; }
    if(left<=0){ done(); }
  },1000);
  window.addEventListener('hashchange',()=>{ over=true; clearInterval(timer); clearTimeout(pending); },{once:true});
  function done(){
    if(over) return;
    over=true; clearInterval(timer); clearTimeout(pending);
    const got=score>=15?award(key,'racer'):false;
    app.innerHTML=`<div class="result"><div class="rem">${score>=15?'🏁':'⏱️'}</div>
      <h3>${score} words in 60 seconds</h3>
      <p>${score>=15?(got?'Badge unlocked: Racer':'You already had the Racer badge.'):'Score 15 or more to unlock the Racer badge.'}</p>
      <div class="btnrow"><button class="btn" onclick="go('${key}/race')">Race again</button>
      <button class="btn ghost" onclick="go('${key}')">Back to theme</button></div></div>`;
  }
  ask();
}

/* ── word climb (leitner) ── */
const CLIMB_SESSION = 20;
function renderClimb(app,l,t,d,key){
  let boxes=getLeitner(key);
  d.words.forEach(w=>{ if(!boxes[w.w]) boxes[w.w]=1; });
  let seen=0;
  function pick(){
    const weighted=[];
    d.words.forEach(w=>{ const b=boxes[w.w]; for(let n=0;n<(6-b);n++) weighted.push(w); });
    return weighted.length?weighted[Math.floor(Math.random()*weighted.length)]:null;
  }
  function counts(){ const c=[0,0,0,0,0]; d.words.forEach(w=>c[boxes[w.w]-1]++); return c; }
  function mastered(){ return counts()[4]===d.words.length; }
  function boxbar(){
    const c=counts();
    return `<div class="boxes">${c.map((n,i)=>`<div class="box ${i===4&&n===d.words.length?'full':''}"><b>${n}</b><span>Box ${i+1}</span></div>`).join('')}</div>`;
  }
  function grade(w,up){
    boxes[w.w]= up ? Math.min(5,boxes[w.w]+1) : 1;
    setLeitner(key,boxes); say(w.w); seen++;
    if(mastered()) return summit();
    if(seen>=CLIMB_SESSION) return breather();
    step(false);
  }
  function step(reveal,w){
    if(mastered()) return summit();
    w = w || pick();
    app.innerHTML=`
      <div class="gamehead"><h2>🏔️ Word Climb</h2>
        <div class="stat"><div>${seen}/${CLIMB_SESSION}<span>this round</span></div><div>${counts()[4]}/${d.words.length}<span>mastered</span></div></div>
        <button class="btn ghost" onclick="go('${key}')">Quit</button></div>
      <div class="bar"><i style="width:${seen/CLIMB_SESSION*100}%"></i></div>
      ${boxbar()}
      <div class="panel"><div class="prompt">
        <div class="ppos">${esc(w.pos)}</div>
        ${reveal
          ? `<div class="pword">${esc(w.w)}</div><div class="pdef" style="color:var(--muted);font-size:1rem;margin-top:.5rem">${esc(w.d)}</div><div style="font-style:italic;color:var(--muted);margin-top:.6rem">\u201C${esc(w.x)}\u201D</div>`
          : `<div class="pdef">${esc(w.d)}</div>
             <div class="phint"><b>In a sentence</b>${esc(gapSentence(w.w,w.x)||w.x)}</div>`}
      </div>
      <div class="btnrow">
        ${reveal
          ? `<button class="btn mint" id="knew">I knew it 👍</button><button class="btn ghost" id="nope">Not yet 👎</button>`
          : `<button class="btn" id="show">Show the word 👀</button>`}
      </div></div>`;
    if(reveal){
      document.getElementById('knew').onclick=()=>grade(w,true);
      document.getElementById('nope').onclick=()=>grade(w,false);
    } else {
      document.getElementById('show').onclick=()=>step(true,w);
    }
  }
  function breather(){
    const c=counts();
    app.innerHTML=`<div class="result"><div class="rem">⛰️</div>
      <h3>Round complete</h3>
      <p>${CLIMB_SESSION} cards done — ${c[4]} of ${d.words.length} words are at the top.</p></div>
      ${boxbar()}
      <div class="btnrow">
        <button class="btn" id="again">Climb another round</button>
        <button class="btn ghost" onclick="go('${key}')">Back to theme</button>
      </div>`;
    document.getElementById('again').onclick=()=>{ seen=0; step(false); };
  }
  function summit(){
    const got=award(key,'climber');
    app.innerHTML=`<div class="result"><div class="rem">🏔️</div><h3>Summit reached!</h3>
      <p>Every word is in box 5. ${got?'Badge unlocked: Climber':'You already had the Climber badge.'}</p></div>
      ${boxbar()}
      <div class="btnrow"><button class="btn ghost" onclick="resetClimb('${key}')">Reset boxes</button>
      <button class="btn" onclick="go('${key}')">Back to theme</button></div>`;
  }
  if(mastered()) return summit();
  step(false);
}
function resetClimb(key){ setLeitner(key,{}); go(key+'/climb'); }

/* ── board mode ── */
function renderBoard(l,t,d,key){
  document.body.classList.add('board');
  const bw=document.getElementById('boardwrap');
  let pool=shuffle(d.words), i=0, reveal=false, s1=0, s2=0;
  function draw(){
    const w=pool[i];
    bw.innerHTML=`
      <div class="bteams">
        <div class="bteam t1"><span class="nm">Team A</span>
          <button onclick="bScore(1,-1)">−</button><span class="sc" id="s1">${s1}</span><button onclick="bScore(1,1)">+</button></div>
        <div class="bteam t2"><span class="nm">Team B</span>
          <button onclick="bScore(2,-1)">−</button><span class="sc" id="s2">${s2}</span><button onclick="bScore(2,1)">+</button></div>
      </div>
      <div class="bstage">
        <div class="bpos">${esc(w.pos)}</div>
        ${reveal ? `<div class="bword">${esc(w.w)}</div><div class="bx">“${esc(w.x)}”</div>`
                 : `<div class="bdef">${esc(w.d)}</div><div class="bx">“${esc(gapSentence(w.w,w.x)||w.x)}”</div>`}
      </div>
      <div class="bctrl">
        ${reveal ? `<button class="btn mint" onclick="bSay()">🔊 Say it</button><button class="btn" onclick="bNext()">Next word →</button>`
                 : `<button class="btn" onclick="bReveal()">Reveal 👀</button>`}
        <button class="btn ghost" onclick="bExit()">Exit board mode</button>
        <span style="align-self:center;color:var(--muted);font-size:.9rem">${i+1} / ${pool.length}</span>
      </div>`;
  }
  window.bScore=(team,delta)=>{ if(team===1){s1=Math.max(0,s1+delta);}else{s2=Math.max(0,s2+delta);} draw(); };
  window.bReveal=()=>{ reveal=true; say(pool[i].w); draw(); };
  window.bSay=()=>say(pool[i].w);
  window.bNext=()=>{ i=(i+1)%pool.length; reveal=false; draw(); };
  window.bExit=()=>{ document.body.classList.remove('board'); go(key); };
  draw();
}

/* ── print ── */
function renderPrint(app,l,t,d,key){
  app.innerHTML=`
    <div class="gamehead"><h2>🖨️ ${esc(t.title)} — word list</h2>
      <div class="btnrow" style="margin:0"><button class="btn" onclick="window.print()">Print</button>
      <button class="btn ghost" onclick="go('${key}')">← Back</button></div></div>
    <div class="panel">`+
    d.words.map(w=>`<div class="wordrow">
      <div class="wb"><span class="ww">${esc(w.w)}</span><span class="wp">${esc(w.pos)}</span>
      <div class="wd">${esc(w.d)}</div><div class="wx">“${esc(w.x)}”</div></div>
    </div>`).join('')+`</div>`;
}

/* ─────────── theme toggle ─────────── */
function toggleTheme(){
  const h=document.documentElement;
  const next=h.getAttribute('data-theme')==='light'?'dark':'light';
  h.setAttribute('data-theme',next);
  document.getElementById('theme-btn').textContent=next==='light'?'☀️':'🌙';
  localStorage.setItem('hub-theme',next);
}
(function(){
  if(localStorage.getItem('hub-theme')==='light'){
    document.documentElement.setAttribute('data-theme','light');
    document.getElementById('theme-btn').textContent='☀️';
  }
})();

route();
</script>
